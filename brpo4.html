			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');

			}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();

<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Виды статического анализа
```
void foo (void) {
	char *p = NULL;
	*p = 0;
}
```
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Потоково-чувствительный анализ

Разыменование после сравнения с NULL.
```
void foo (char *p) {
	if (p == NULL) {
		*p = 0;
	}
}
```

Неконсистентные проверки на NULL
```
void foo (char *p) {
	if (p != NULL) {
		*p = 5;
	}
	*p = 42; 
}
```

Требование: чувствительный к потоку анализ.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Разыменование NULL на некотором пути
```
void foo (char *p, int x) {
	if (x > 0)
		p = NULL;
	if (x < 0)
		*p = 42; // Нет ошибки
}

void bar (char *p, int x) {
	if (x > 0)
		p = NULL;
	if (x < 7)
		*p = 42; // Ошибка
}
```
Чувствительный к потоку анализ не может проанализировать, существует ли пересечение условий, мы знаем только, что когда-то p = NULL, а когда-то p разыменовывается. 

Требование: чувствительный к путям анализ.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Всё это был внутрипроцедурный анализ - анализ одной функции

Разыменование NULL в вызываемой функции.

```
void foo (char *p, int x) {
	if (p != NULL)
		*p = 5;
	cderef(p, x); // Ошибка
}

void bar (char *p, int x) {
	if (p != NULL)
		cderef(p, x); // Нет ошибки
}

void baz (char *p, int x) {
	cderef(NULL, abs(x)); //Нет ошибки
}

void cderef (char *p, int x) {
	if (x < 0)
		*p = 42;
}
```
Если объединить этот код в одну функцию, то предыдущие виды анализа смогут дать какую-то информацию, но нам нужно связать вызов функции со значениями переменных

Требование: межпроцедурный чувствительный к контексту анализ.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Разыменование псевдонима после сравнения с NULL.
```
struct s {
	char *buf;
	...
};

void func (struct s *p) {
	char *q = p->buf;
	if (p->buf == NULL) { // q == NULL
	*q = 42; // Ошибка
	}
}
```
Одна и та же ячейка памяти может именоваться по-разному. Все предыдущие анализы требуют понимая, какая ячейка памяти изменяется. С какого-то момента это может быть не очевидно. Задача узнавания всех точных имен ячейки памяти тоже алгоритмически неразрешима. Стараемся понять, какие потенциальные множества ячеек могут затрагиваться проверяемым условием. 

Требование: анализ псевдонимов (алиасов).
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Разыменование NULL в поле структуры.

```
struct s {
	int x;
	int *next;
};

void write (struct s *q) {
	*(q->next) = 42;
}

void foo (struct s *p) {
	p->next = NULL;
	write(p); // Ошибка
}
```
Требование: чувствительный к полям анализ (field sensitive).
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Переполнение буфера из-за некорректного вычисления индекса.
```
int buf[100];

void foo(unsigned i) {
	if (i >= 100)
		return;
		// i ∈ [0, 99]
	// ...
	x = i + 5; // x ∈ [5, 104]
	buf[x] = 42 // Ошибка
}
```
Нужен какой-либо чувстительный к путям/потоку анализ, который будет хранить возможные значения целочисленных переменных

Требование: анализ связей между значениями (интервальный или точнее).
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

int buf[100];

int find(void) {
	for (int i = 0; i < 100; i++) {
		if (check(i))
			break;
	}
	return buf[i]; // Ошибка
}
```
Требование: анализ циклов.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Разыменование NULL после проверки.
```
void foo() {
	int *p = get_pointer();

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}
