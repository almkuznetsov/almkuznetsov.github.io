	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

AFL map - массив байтовых счетчиков, доступный по указателю `__afl_area_ptr`. В нем каждой инструментированной локации присвоен номер, который вычисляется при запуске (PCGUARD/fast-инструментация) или при линковке (LTO-инструментация). При достижении точки инструментирования добавляется условный: 
```
__afl_area_ptr[42]++
```

src: [afl-under-hood](https://blog.ritsec.club/posts/afl-under-hood/#coverage-instrumentation)

При написании кода человеку может быть сложно и неэффективно ориентироваться на покрытие по базовым блокам или ветвям условных переходов - это "техническое" покрытие нужно для работы инструментов, и, например, может меняться от окружения и опций сборки.

Один из способов оценки эффективности фаззинг-тестирования - оценка покрытия кода (в строках или функциях) исследуемого проекта (хотя она и не учитывает, например, поверхность атаки)

На примере cppcheck:
```bash
CFLAGS="-fprofile-instr-generate -fcoverage-mapping" CXXFLAGS="-fprofile-instr-generate -fcoverage-mapping" CC=clang CXX=clang++ cmake .

CFLAGS="-fprofile-instr-generate -fcoverage-mapping" CXXFLAGS="-fprofile-instr-generate -fcoverage-mapping" CC=clang CXX=clang++ make

mkdir -p cov
export LLVM_PROFILE_FILE="$(pwd)/cov/run-%p%c.profraw"

./bin/cppcheck $(find "output/default/queue" -type f) 2>&1 > /dev/null

llvm-profdata merge -sparse cov/run-*.profraw -o cov/cppcheck.profdata

llvm-cov show ./bin/cppcheck \
	-instr-profile=cov/cppcheck.profdata \
	-format=html \
	-output-dir=cov/html
```

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
	var isLight = isLight(bgColor);

	if(isLight){
		document.body.classList.add('has-light-background');
	} else {
		document.body.classList.add('has-dark-background');
	}
